name: PostgreSQL verification

on:
  pull_request:
  push:
    branches: [main]

jobs:
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: oratry_test
          POSTGRES_USER: oratry
          POSTGRES_PASSWORD: oratry-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oratry -d oratry_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      ORATRY_POSTGRES_TEST: "1"
      ORATRY_POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://oratry:oratry-test-only@localhost:5432/oratry_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_database_schema.py
