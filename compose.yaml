services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: oratry
      POSTGRES_USER: oratry
      POSTGRES_PASSWORD: oratry-local-only
    ports:
      # Default avoids colliding with a locally installed PostgreSQL service.
      - "${ORATRY_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oratry -d oratry"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - oratry-postgres-data:/var/lib/postgresql/data

volumes:
  oratry-postgres-data:
