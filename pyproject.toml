[project]
name = "oratry"
version = "0.1.0"
description = "Oratry V1 modular-monolith backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["boto3>=1.35,<2", "fastapi>=0.115,<1", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0", "alembic>=1.13", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.4", "email-validator>=2.2", "PyJWT[crypto]>=2.9", "pwdlib[argon2]>=0.2", "openai>=1.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["app*", "oratry*", "schemas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
