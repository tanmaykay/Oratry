[project]
name = "oratry"
version = "0.1.0"
description = "Oratry V1 modular-monolith backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0", "alembic>=1.13", "pydantic-settings>=2.4", "email-validator>=2.2", "PyJWT>=2.9", "pwdlib[argon2]>=0.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
